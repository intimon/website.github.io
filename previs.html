        		<!-- This is in here for the preloader! It needs to be loaded very quickly before everything else! -->
		<style>
			#site-preloader {
				position: fixed;
				inset: 0;
				z-index: 999999;
				display: none;
				align-items: center;
				justify-content: center;
				background: #fff;
				opacity: 1;
				visibility: visible;
				transition: opacity 0.6s ease, visibility 0.6s ease;
			}
			
			html.preloader-active #site-preloader {
				display: flex;
			}
			
			#site-preloader video {
				display: block;
				width: 100%;
				max-height: 100vh;
				object-fit: contain;
			}
			
			@media (min-width: 768px) {
				#site-preloader video {
					width: 75%;
				}
			}
			
			@media (min-width: 1440px) {
				#site-preloader video {
					width: 50%;
				}
			}
			
			#site-preloader.hidden {
				opacity: 0;
				pointer-events: none;
				visibility: visible;
			}
			
			#site-preloader {
				transition: opacity 0.6s ease;
			}
		</style>
