<!DOCTYPE HTML>
<!--

	Feel free to get inspired if you take someting for yourself, a mention would be nice!

<html>

 	<! -------------------------------- Head --------------------------------->
	<! ----------------------------------------------------------------------->
	<head>
		<title>Timon Holzer</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			#site-preloader {
				position: fixed;
				inset: 0;
				z-index: 999999;

				display: none;
				align-items: center;
				justify-content: center;

				background: #fff;
				opacity: 1;
				visibility: visible;

				transition: opacity 0.6s ease, visibility 0.6s ease;
			}

			html.preloader-active #site-preloader {
				display: flex;
			}

			#site-preloader video {
				display: block;
				width: 100%;
				max-height: 100vh;
				object-fit: contain;
			}

			@media (min-width: 768px) {
				#site-preloader video {
					width: 75%;
				}
			}

			@media (min-width: 1440px) {
				#site-preloader video {
					width: 50%;
				}
			}

			#site-preloader.hidden {
				opacity: 0;
				pointer-events: none;
				visibility: visible;
			}
			
			#site-preloader {
				transition: opacity 0.6s ease;
			}
		</style>
		
		<!-- Favicon -->
		<link rel="icon" type="image/png" href="images/favicon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="images/favicon/favicon.svg" />
		<link rel="shortcut icon" href="images/favicon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png" />
		<link rel="manifest" href="images/favicon/site.webmanifest" />
		
		<!-- Open Graph / Facebook / LinkedIn / Discord -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://intimon.github.io/website.github.io/" />
		<meta property="og:title" content="Timon C. Holzer" />
		<meta property="og:description" content="Freelance and Portfolio Page of a creative and technical Problemsolver!" />
		<meta property="og:image" content="https://intimon.github.io/website.github.io/images/Logo_THC/Link-Image.webp" />
	</head>

	
	<! -------------------------------- Body --------------------------------->
	<! ----------------------------------------------------------------------->
	<body class="homepage is-preload">
		<script>
			try {
				if (!sessionStorage.getItem("preloaderShown")) {
					sessionStorage.setItem("preloaderShown", "true");
					document.documentElement.classList.add("preloader-active");
				}
			} catch (error) {
				document.documentElement.classList.add("preloader-active");
			}
		</script>

		<div id="site-preloader">
			<video
				id="preloader-video"
				autoplay
				muted
				playsinline
				loop
				preload="auto">
			</video>
		</div>
		
		<div id="loader-wrapper">
		  <div class="spinner"></div>
		</div>
